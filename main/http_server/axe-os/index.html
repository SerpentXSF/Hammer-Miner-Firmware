<!doctype html>
<html lang="en" style="font-size: 14px">
  <head>
    <meta charset="UTF-8" />
    <!-- The type said image/svg+xml while pointing at an .ico, which browsers
         are entitled to reject. Declared honestly, with PNG sizes so small
         tabs get the flat-gold mark rather than a downscaled gradient. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SerpentX | Stay Open</title>
    <style>
      /* 简单的 Loading 样式，在 JS 加载前显示 */
      body { margin: 0; background-color: #050910; color: #fff; font-family: sans-serif; }
      #app-loading {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        z-index: 9999; transition: opacity 0.3s;
      }
      .spinner {
        width: 40px; height: 40px;
        border: 3px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top-color: #19e1a5; /* 主题色 */
        animation: spin 1s ease-in-out infinite;
      }
      .loading-text { margin-top: 15px; font-size: 14px; color: #9ca3af; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading">
        <div class="spinner"></div>
        <div class="loading-text">Loading SerpentX...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
