<!DOCTYPE html>
<html>
<body>
<script>
fetch("https://api.github.com/repos/Hammer-Miner/www/releases/tags/v1.3.5")
.then(r => r.json())
.then(d => {
    let url = d.assets[0].url;
    fetch(url, { headers: { 'Accept': 'application/octet-stream' } })
    .then(r => {
        console.log("Status:", r.status);
        return r.blob();
    })
    .then(b => console.log("Blob size:", b.size))
    .catch(e => console.error("Fetch Error:", e.message));
})
.catch(e => console.error("API Error:", e.message));
</script>
</body>
</html>
